[package]
name = "s3ite"
version = "0.7.0"
edition = "2021"
description = "An S3 server backed by SQLite"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/seddonm1/s3ite"
keywords = ["s3", "sqlite"]
categories = ["database"]

[features]
default = ["binary"]
binary = ["tokio/full", "clap", "tracing-subscriber", "hyper", "hyper-util"]

[dependencies]
async-trait = "0.1.89"
base64-simd = "0.8.0"
bytes = "1.11.1"
chrono = { version = "0.4.44", default-features = false, features = [
    "std",
    "clock",
] }
clap = { version = "4.6.1", optional = true, features = ["derive"] }
crossbeam-channel = "0.5.15"
futures = "0.3.32"
hex-simd = "0.8.0"
hyper = { version = "1.10.1", optional = true, features = ["full"] }
hyper-util = { version = "0.1.20", optional = true, features = [
    "http1",
    "http2",
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
md-5 = "0.11.0-rc.5"
mime = "0.3.17"
nugine-rust-utils = "0.3.1"
numeric_cast = "0.3.0"
path-absolutize = "3.1.1"
rusqlite = { version = "0.40.0", features = ["time", "uuid", "bundled"] }
s3s = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
time = "0.3.47"
tokio = { version = "1.52.3", features = ["fs", "io-util"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", optional = true, features = [
    "env-filter",
    "time",
] }
transform-stream = "0.3.1"
uuid = { version = "1.23.2", features = ["v4"] }

[dev-dependencies]
s3s-aws = "0.13.0"
anyhow = { version = "1.0.102", features = ["backtrace"] }
# Keep the AWS test stack before the hmac 0.13 final release line; s3s 0.13
# pins hmac 0.13.0-rc.5.
aws-config = { version = "=1.8.13", default-features = false }
aws-credential-types = { version = "=1.2.13", features = ["test-util"] }
aws-runtime = "=1.7.1"
aws-sdk-s3 = { version = "=1.124.0", features = ["behavior-version-latest"] }
aws-sigv4 = "=1.4.1"
once_cell = "1.21.4"
tokio = { version = "1.52.3", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }

[profile.release]
codegen-units = 1
opt-level = 3

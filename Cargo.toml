[package]
name = "s3ite"
version = "0.7.0"
edition = "2024"
description = "An S3 server backed by SQLite"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/seddonm1/s3ite"
keywords = ["s3", "sqlite"]
categories = ["database"]

[features]
default = ["binary"]
binary = [
    "clap",
    "hyper",
    "hyper-util",
    "tokio/macros",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "tower",
    "tower-http",
    "tracing-error",
    "tracing-subscriber",
    "yaml_serde",
]

[dependencies]
async-trait = "0.1.89"
bytes = "1.11.1"
clap = { version = "4.6.1", optional = true, features = ["derive"] }
crossbeam-channel = "0.5.15"
futures = "0.3.32"
hyper = { version = "1.10.1", optional = true, default-features = false, features = [
    "http1",
    "http2",
    "server",
] }
hyper-util = { version = "0.1.20", optional = true, default-features = false, features = [
    "http1",
    "http2",
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
md-5 = "0.11.0-rc.5"
mime = "0.3.17"
path-absolutize = "3.1.1"
rusqlite = { version = "0.40.0", features = ["time", "uuid", "bundled"] }
s3s = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = "0.3.47"
tokio = { version = "1.52.3", features = ["fs", "io-util", "rt", "sync", "time"] }
tower = { version = "0.5.3", optional = true, default-features = false, features = [
    "limit",
    "util",
] }
tower-http = { version = "0.6.11", optional = true, default-features = false, features = [
    "cors",
] }
tracing = "0.1.44"
tracing-error = { version = "0.2.1", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, features = [
    "env-filter",
    "time",
] }
uuid = { version = "1.23.2", features = ["v4"] }
yaml_serde = { version = "0.10", optional = true }

[dev-dependencies]
s3s-aws = "0.13.0"
anyhow = { version = "1.0.102", features = ["backtrace"] }
aws-config = { version = "=1.8.13", default-features = false }
aws-credential-types = { version = "=1.2.13", features = ["test-util"] }
aws-sdk-s3 = { version = "=1.124.0", features = ["behavior-version-latest"] }

[profile.release]
codegen-units = 1
opt-level = 3

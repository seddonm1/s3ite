[package]
name = "s3ite"
version = "0.7.0"
edition = "2024"
description = "An S3 server backed by SQLite"
license = "MIT"
readme = "README.md"
repository = "https://github.com/seddonm1/s3ite"
keywords = ["s3", "sqlite"]
categories = ["database"]

[dependencies]
aes-gcm = "0.11.1"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.8", features = ["derive"] }
futures = "0.3.34"
getrandom = "0.4.3"
hyper = { version = "1.12.0", default-features = false, features = [
    "http1",
    "http2",
    "server",
] }
hyper-util = { version = "0.1.21", default-features = false, features = [
    "http1",
    "http2",
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
http-body-util = { version = "0.1.5" }
md-5 = "0.11.0"
mime = "0.3.18"
path-absolutize = "4.0.1"
rusqlite = { version = "0.43.0", features = [
    "time",
    "uuid",
    "bundled",
    "blob",
    "limits",
] }
s3s = "0.17.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = { version = "0.5.3", default-features = false, features = [
    "limit",
    "util",
] }
tower-http = { version = "0.7.1", default-features = false, features = [
    "cors",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "time",
] }
uuid = { version = "1.29.3", features = ["v4"] }
yaml_serde = { version = "0.10.7" }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7.0", default-features = false }

[dev-dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
aws-config = { version = "=1.13.2", default-features = false }
aws-credential-types = { version = "=1.3.1", features = ["test-util"] }
aws-sdk-s3 = { version = "=1.159.0", features = ["behavior-version-latest"] }
aws-sigv4 = "=1.6.5"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "http2",
    "rustls",
    "stream",
] }
serial_test = "4.0.1"
sha2 = "0.11.1"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"
panic = "abort"
strip = true

[package.metadata.multivers.x86_64]
cpus = ["x86-64", "x86-64-v2", "x86-64-v3", "x86-64-v4"]

[package.metadata.multivers.aarch64]
cpus = ["generic", "apple-a14"]

[package]
name = "s3ite"
version = "0.7.0"
edition = "2024"
description = "An S3 server backed by SQLite"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/seddonm1/s3ite"
keywords = ["s3", "sqlite"]
categories = ["database"]

[features]
default = ["binary"]
binary = [
    "clap",
    "hyper",
    "hyper-util",
    "http-body-util",
    "tokio/macros",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "tower",
    "tower-http",
    "tracing-subscriber",
    "yaml_serde",
]

[dependencies]
async-trait = "0.1.89"
bytes = "1.11.1"
clap = { version = "4.6.1", optional = true, features = ["derive"] }
futures = "0.3.32"
getrandom = "0.3.3"
hyper = { version = "1.10.1", optional = true, default-features = false, features = [
    "http1",
    "http2",
    "server",
] }
hyper-util = { version = "0.1.20", optional = true, default-features = false, features = [
    "http1",
    "http2",
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
http-body-util = { version = "0.1.3", optional = true }
md-5 = "0.11.0-rc.5"
mime = "0.3.17"
path-absolutize = "3.1.1"
rusqlite = { version = "0.40.0", features = [
    "time",
    "uuid",
    "bundled",
    "blob",
] }
s3s = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = "0.3.47"
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "rt",
    "sync",
    "time",
] }
tower = { version = "0.5.3", optional = true, default-features = false, features = [
    "limit",
    "util",
] }
tower-http = { version = "0.6.11", optional = true, default-features = false, features = [
    "cors",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", optional = true, features = [
    "env-filter",
    "time",
] }
uuid = { version = "1.23.2", features = ["v4"] }
yaml_serde = { version = "0.10", optional = true }

[dev-dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
aws-config = { version = "=1.8.15", default-features = false }
aws-credential-types = { version = "=1.2.14", features = ["test-util"] }
aws-sdk-s3 = { version = "=1.129.0", features = ["behavior-version-latest"] }
aws-sigv4 = "=1.4.2"
reqwest = { version = "0.12", default-features = false, features = [
    "http2",
    "rustls-tls",
    "stream",
] }
serial_test = "3"
tempfile = "3"

[profile.release]
codegen-units = 1
opt-level = 3
lto = "thin"
panic = "abort"
strip = true

[package.metadata.multivers.x86_64]
cpus = ["x86-64", "x86-64-v2", "x86-64-v3", "x86-64-v4"]

[package.metadata.multivers.aarch64]
cpus = ["generic", "neoverse-n1", "neoverse-v1"]

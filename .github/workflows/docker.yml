name: Test and publish Docker images
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/seddonm1/s3ite

jobs:
  image:
    name: Test Linux ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ github.event.release.prerelease && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,enable=${{ github.event_name != 'release' }}
      - name: Build image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/s3ite-${{ matrix.arch }}.tar
      - name: Start image and test signed S3 requests
        env:
          ARCH: ${{ matrix.arch }}
          AWS_ACCESS_KEY_ID: smoke-access
          AWS_SECRET_ACCESS_KEY: smoke-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          skopeo copy "oci-archive:$RUNNER_TEMP/s3ite-$ARCH.tar" docker-daemon:s3ite:smoke
          server=$(docker run -d --volume /data \
            --publish 127.0.0.1::8014 --publish 127.0.0.1::8015 \
            s3ite:smoke --root /data --host 0.0.0.0 --port 8014 --health-bind 0.0.0.0:8015 \
            --access-key "$AWS_ACCESS_KEY_ID" --secret-key "$AWS_SECRET_ACCESS_KEY")
          trap 'docker logs "$server"; docker rm -fv "$server" >/dev/null' EXIT
          bash scripts/smoke_s3.sh "http://$(docker port "$server" 8014/tcp)" "http://$(docker port "$server" 8015/tcp)"
      - name: Save tested release image
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/s3ite-${{ matrix.arch }}.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish tested images
    if: github.event_name == 'release'
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
      - name: Publish both platforms under the release tags
        env:
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          : "${TAGS:?No image tags were generated for this release}"
          sources=()
          for arch in amd64 arm64; do
            archive="oci-archive:$RUNNER_TEMP/images/s3ite-$arch.tar"
            digest=$(skopeo inspect --raw "$archive" | sha256sum | cut -d ' ' -f 1)
            source="$IMAGE@sha256:$digest"
            skopeo copy --all --preserve-digests "$archive" "docker://$source"
            sources+=("$source")
          done
          tags=()
          while IFS= read -r tag; do tags+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
